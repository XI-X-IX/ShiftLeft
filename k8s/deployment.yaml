# Kubernetes API version for Deployments
apiVersion: apps/v1
# Kubernetes resource type
kind: Deployment
metadata:
  # Deployment name
  name: pipeline-app
spec:
  # Number of pods to keep running
  replicas: 2
  # Selector must match the pod template labels
  selector:
    matchLabels:
      app: pipeline
  # Pod template used to create replicas
  template:
    metadata:
      labels:
        # Label applied to created pods
        app: pipeline
    spec:
      containers:
      # Main application container definition
      - name: app
        # Container image to deploy
        image: pipeline-app
        ports:
        # Port exposed by the container
        - containerPort: 5000