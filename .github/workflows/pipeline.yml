name: Pipeline
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ⚡ Cache pip
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    # Install deps + tools
    - name: Install deps & tools
      run: |
        pip install -r app/requirements.txt
        pip install bandit safety

    # Install Trivy
    - name: Install Trivy
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

    # Secrets scan
    - name: Scan secrets
      uses: trufflesecurity/trufflehog@main

    # SAST
    - name: Run SAST
      run: bandit -c security/bandit.yaml -r app/ -ll

    # Dependency scan
    - name: Dependency scan
      run: safety check --full-report --policy-file security/safety-policy.json

    # Build Docker
    - name: Build Docker
      run: docker build -t pipeline-app -f app/Dockerfile app

    # Scan Docker image
    - name: Scan Docker image
      run: trivy image --severity HIGH,CRITICAL --exit-code 1 pipeline-app

    # Upload reports (clean)
    - name: Upload reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

    - name: Build success
      run: echo "Pipeline OK"